repos:
  -   repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v3.2.0
      hooks:
        -   id: trailing-whitespace
        -   id: end-of-file-fixer
        -   id: check-yaml
  -   repo: local
      hooks:
        -   id: gradle-check
            name: Gradle Check
            entry: ./gradlew check
            language: system
            pass_filenames: false